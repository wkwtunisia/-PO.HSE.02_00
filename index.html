<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سياسة الصحة والسلامة والبيئة</title>

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            padding: 60px 20px;
            background-color: #f8f9fa;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .logo {
            max-width: 300px;
            margin-bottom: 30px;
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        h1 {
            font-size: 2.5em;
            color: #003087;
            margin: 20px 0;
        }

        .subtitle {
            font-size: 1.4em;
            color: #555;
            margin-bottom: 50px;
        }

        .buttons {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 18px 40px;
            font-size: 1.4em;
            font-weight: 600;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            min-width: 280px;
            display: inline-block;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(0,0,0,0.12);
        }

        .view-btn {
            background-color: #28a745;
        }

        .view-btn:hover {
            background-color: #218838;
            transform: translateY(-4px);
        }

        .download-btn {
            background-color: #007bff;
        }

        .download-btn:hover {
            background-color: #0056b3;
            transform: translateY(-4px);
        }

        @media (max-width: 768px) {
            .logo {
                max-width: 220px;
            }

            h1 {
                font-size: 2em;
            }

            .subtitle {
                font-size: 1.2em;
            }

            .buttons {
                flex-direction: column;
                width: 90%;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <img src="https://www.wkw-group.com/fileadmin/templates/res/img/logo-wkw-group.svg"
         alt="Logo WKW Group"
         class="logo">

    <h1>سياسة الصحة والسلامة والبيئة</h1>
    <p class="subtitle">FR.DIG.05_00 du 15/10/2023</p>

    <div class="buttons">
        <!-- View -->
        <a href="Politique-HSE-2023.pdf" target="_blank" class="btn view-btn">
            Voir le PDF
        </a>

        <!-- Download -->
        <a href="Politique-HSE-2023.pdf" download class="btn download-btn">
            Télécharger le PDF
        </a>
    </div>

</body>
</html>
